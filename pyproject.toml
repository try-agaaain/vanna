[project]
name = "vanna"
version = "0.1.0"
description = "A Python project."
authors = [
    { name="Your Name", email="your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "click>=8.1.8",
    "faiss-cpu>=1.7.4",
    "fastapi>=0.103.2",
    "mysql>=0.0.3",
    "openai>=0.8.0",
    "pandas>=1.1.5",
    "plotly>=5.18.0",
    "pydantic>=2.5.3",
    "pymysql>=1.1.1",
    "pyyaml>=6.0.1",
    "uvicorn>=0.22.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
